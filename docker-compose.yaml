services:
  rabbitmq:
    image: rabbitmq:management
    container_name: booking-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /dev
      RABBITMQ_PLUGINS: rabbitmq_prometheus
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 500MB
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend

  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres
    environment:
      POSTGRESQL_DATABASE: test-db
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_db_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
  rabbitmq_log:
  postgres_test_db_data: