spring:
  application:
    name: booking

  datasource:
#    url: "jdbc:postgresql://localhost:5432/test-db"
#    username: "admin"
#    password: "admin"
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  username: ${REDIS_USER}
  password: ${REDIS_USER_PASSWORD}

rabbitmq:
  config:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
  spot-queue:
    name: "spot-order"
    routing:
      key: "place-spot-order"
  booking-queue:
    name: "booking-order"
    routing:
      key: "place-booking-order"
  notification-queue:
    name: "notification-order"
    routing:
      key: "place-notification-order"
  exchange:
    name: "main-exchange"